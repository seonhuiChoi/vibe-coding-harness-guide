name: Verify and deploy

# 하네스가 배포 게이트다. harness/verify.sh 14개 검사를 통과하지 못하면
# deploy 잡이 아예 실행되지 않는다. "검사에 걸리면 배포가 안 된다".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: 하네스 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: harness/verify.sh
        run: bash harness/verify.sh

      - name: 배포본 준비
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: GitHub Pages 배포
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
